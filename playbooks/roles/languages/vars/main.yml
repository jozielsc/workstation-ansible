---
# Pacote do Go por os_family. Uma família fora deste mapa só gera aviso (go.yml).
languages_go_package:
  Debian: golang
  RedHat: golang
  Void: go
  Archlinux: go

# Pacotes do Node.js por os_family. No Void, o nodejs já traz o npm; nas outras, o npm é um pacote separado. Uma
# família fora deste mapa instala só o nodejs (node.yml).
languages_node_packages:
  Debian: [nodejs, npm]
  RedHat: [nodejs, npm]
  Void: [nodejs]
  Archlinux: [nodejs, npm]
