---
# Lint em PRs e pushes na main. Roda o mesmo `make lint` do ambiente local,
# com as versões travadas no uv.lock. Actions pinadas por SHA (a tag fica no
# comentário).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar as dependências de desenvolvimento
        run: uv sync --locked

      - name: make lint
        run: make lint
