---
- name: Provisionamento do Workstation
  hosts: all
  become: true
  # Os fatos são coletados nos pre_tasks: primeiro só os da distro, sem sudo, para checar se ela é suportada; depois
  # todos, com sudo, como faria o gather_facts.
  gather_facts: false

  vars:
    profile: default
    # Famílias com arquivo vars/<os_family>.yml nas roles. Uma distro fora delas para o play logo no início.
    supported_os_families: ['Debian', 'Void', 'RedHat', 'Archlinux']
    # true força a execução numa distro fora da lista (no profiles/local.yml ou com -e allow_unsupported_distro=true).
    allow_unsupported_distro: false

  pre_tasks:
    - name: Carregar variáveis do perfil
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../profiles/{{ profile }}.yml"
      tags: ['always']

    - name: Carregar sobrescritas locais (local.yml)
      ansible.builtin.include_vars:
        file: "{{ _local_profile_file }}"
      vars:
        _local_profile_file: "{{ playbook_dir }}/../profiles/local.yml"
      # O local.yml é opcional (gitignored). O teste roda no controller, onde o
      # include_vars lê o arquivo. Se existir mas for inválido (ou for um
      # symlink quebrado), o play falha.
      when: _local_profile_file is file or _local_profile_file is link
      tags: ['always']

    # Antes de qualquer tarefa com sudo: numa distro sem sudo (por exemplo, Alpine com doas), a coleta completa
    # falharia antes da mensagem abaixo. O subset mínimo traz distribution e os_family; precisa de python3 no host.
    - name: Coletar a distro do host (sem sudo)
      become: false
      ansible.builtin.setup:
        gather_subset: ['!all']
      tags: ['always']

    # Depois dos perfis, para que o override também possa vir do local.yml. Sem esta checagem, numa distro desconhecida
    # os include_vars das roles falham em silêncio e só os fallbacks mínimos são instalados.
    - name: Verificar se a distro é suportada
      vars:
        _distro_supported: "{{ ansible_facts['os_family'] in supported_os_families }}"
        _distro_label: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          (os_family {{ ansible_facts['os_family'] }})
      tags: ['always']
      block:
        - name: Parar numa distro não suportada
          ansible.builtin.assert:
            that: _distro_supported | bool
            quiet: true
            fail_msg: >-
              Distro não suportada: {{ _distro_label }}. Famílias suportadas: {{ supported_os_families | join(', ') }}.
              Para forçar mesmo assim, com um resultado possivelmente parcial, defina allow_unsupported_distro: true no
              profiles/local.yml ou passe -e allow_unsupported_distro=true ao ansible-playbook (no workstation.sh,
              depois de --: ./workstation.sh <comando> -- -e allow_unsupported_distro=true).
          when: not allow_unsupported_distro | bool

        - name: Avisar que a distro não suportada foi forçada
          ansible.builtin.debug:
            msg: >-
              ⚠️ Distro não suportada: {{ _distro_label }}, forçada com allow_unsupported_distro. As roles usam listas
              mínimas de pacotes, e o resultado pode ficar parcial.
          when: allow_unsupported_distro | bool and not _distro_supported | bool

    - name: Coletar os fatos do host
      ansible.builtin.setup:
      tags: ['always']

    - name: Determinar diretório home e user do usuário real (sem sudo)
      become: false
      ansible.builtin.shell: "echo $HOME && whoami"
      register: real_user_info
      changed_when: false
      check_mode: false
      tags: ['always']

    - name: Definir fatos user_home e user_id
      ansible.builtin.set_fact:
        user_home: "{{ real_user_info.stdout_lines[0] }}"
        user_id: "{{ real_user_info.stdout_lines[1] }}"
      tags: ['always']

  roles:
    - { role: devtools, tags: ['devtools', 'packages'] }
    - { role: languages, tags: ['languages'] }
    - { role: docker, tags: ['docker'] }
    - { role: zsh, tags: ['zsh', 'shell'] }
    - { role: ui, tags: ['ui', 'visuals', 'never'] }
    - { role: editors, tags: ['editors', 'nvim'] }
    - { role: dotfiles, tags: ['dotfiles', 'stow'] }
