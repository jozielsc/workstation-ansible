# --- Perfil Local de Exemplo (local.sample.yml) ---
# Copie este arquivo para 'profiles/local.yml' para personalizar sua instalação.
# O arquivo 'profiles/local.yml' é ignorado pelo Git.

# --- Pacotes Extras de Desenvolvimento ---
devtools_extra_packages:
  - fastfetch
  - ncdu

# --- Pacotes Extras do Usuário ---
user_extra_packages: []

# --- Configurações de Features ---
devtools_features:
  lazygit: true
  tpm: true

languages_features:
  python: true
  node: true
  rust: true
  golang: true

# --- Editores Extras ---
editors_extra_packages: []

# --- Interface Gráfica Extras ---
ui_extra_packages: []
