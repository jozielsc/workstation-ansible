---
- name: Instalar Docker (Void)
  ansible.builtin.package:
    name: docker
    state: present

# Os plugins buildx e compose vêm em pacotes próprios (em /usr/libexec/docker/cli-plugins/ no Void). Ficam numa
# transação separada: um plugin indisponível (outra arquitetura, mirror desatualizado) só avisa, sem impedir o Docker.
- name: Instalar os plugins buildx e compose (Void)
  block:
    - name: Instalar docker-buildx e docker-compose
      ansible.builtin.package:
        name:
          - docker-buildx
          - docker-compose
        state: present
  rescue:
    # O erro real fica no stderr (xbps), em failures, no module_stderr (o módulo quebrou) ou no msg; o aviso mostra a
    # última linha do primeiro que tiver conteúdo.
    - name: Avisar que os plugins do Docker não foram instalados
      vars:
        _docker_plugins_stderr: "{{ ansible_failed_result.stderr_lines | default([], true) | map('trim') | select | list }}"
        _docker_plugins_failures: "{{ ansible_failed_result.failures | default([], true) | map('string') | map('trim') | select | list }}"
        _docker_plugins_module: "{{ (ansible_failed_result.module_stderr | default('', true) | string).splitlines() | map('trim') | select | list }}"
        _docker_plugins_msg: "{{ (ansible_failed_result.msg | default('', true) | string).splitlines() | map('trim') | select | list }}"
        _docker_plugins_error: >-
          {{ (_docker_plugins_stderr or _docker_plugins_failures or _docker_plugins_module or _docker_plugins_msg
              or ['erro desconhecido']) | last }}
      ansible.builtin.debug:
        msg: >-
          ⚠️ docker-buildx/docker-compose não instalados: {{ _docker_plugins_error }}. O Docker foi instalado, mas
          'docker buildx' e 'docker compose' não vão funcionar.
