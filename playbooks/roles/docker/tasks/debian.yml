---
- name: Instalar dependências do repositório Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Criar diretório de keyrings do APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave GPG do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configurar repositório oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch[ansible_facts['architecture']] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true
  register: docker_apt_repo

- name: Verificar se o Docker já está instalado
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: docker_dockerd

# Em check mode, um repositório ainda não configurado só foi simulado, e o índice do apt não tem o docker-ce. Como no
# redhat.yml, só pula a instalação quando o Docker ainda não está instalado (sem /usr/bin/dockerd); senão, o check segue.
- name: Informar que o Docker seria instalado (check mode)
  ansible.builtin.debug:
    msg: Docker seria instalado do repositório oficial (download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}).
  changed_when: true
  when:
    - ansible_check_mode
    - docker_apt_repo is changed
    - not docker_dockerd.stat.exists

- name: Instalar Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: not (ansible_check_mode and docker_apt_repo is changed and not docker_dockerd.stat.exists)
