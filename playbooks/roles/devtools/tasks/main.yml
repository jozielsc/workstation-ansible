---
- name: Carregar variáveis específicas do SO
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"
  failed_when: false

- name: Definir pacotes padrão se não configurados pelo SO
  ansible.builtin.set_fact:
    devtools_packages:
      - git
      - curl
      - wget
      - tmux
      - fzf
  when: devtools_packages is not defined

- name: Consolidação dos pacotes a instalar (Devtools)
  ansible.builtin.set_fact:
    _devtools_target_packages: "{{ (devtools_packages | default([])) + (devtools_extra_packages | default([])) + (user_extra_packages | default([])) }}"

- name: "📌 STATUS: Iniciando instalação dos pacotes de Devtools"
  ansible.builtin.debug:
    msg:
      - "================================================================================="
      - " 🛠️ ROLE: Devtools | SISTEMA: {{ ansible_facts['os_family'] }}"
      - " 📦 TOTAL DE PACOTES: {{ _devtools_target_packages | length }} pacotes"
      - " 📋 PACOTES: {{ _devtools_target_packages | join(', ') }}"
      - " ⏳ Processando instalação no gerenciador de pacotes... Por favor aguarde."
      - "================================================================================="

- name: Instalação resiliente de pacotes de desenvolvimento
  block:
    - name: Tentar instalação em lote dos pacotes devtools
      ansible.builtin.package:
        name: "{{ _devtools_target_packages }}"
        state: present
  rescue:
    - name: Aviso de falha na instalação em lote - tentando pacotes individualmente
      ansible.builtin.debug:
        msg: "⚠️ Falha na instalação em lote de devtools. Alternando para instalação individual por pacote..."

    - name: Instalar pacotes devtools individualmente
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ _devtools_target_packages }}"
      register: _devtools_indiv_results
      failed_when: false

    - name: Reportar pacotes indisponíveis no repositório
      ansible.builtin.debug:
        msg: "⚠️ Aviso: O pacote '{{ item.item }}' não foi encontrado ou falhou ao ser instalado."
      loop: "{{ _devtools_indiv_results.results | default([]) }}"
      when: item.failed is defined and item.failed
      loop_control:
        label: "{{ item.item }}"

- name: Instalar Lazygit (Custom/Binary)
  ansible.builtin.include_tasks: install_lazygit.yml
  when:
    - devtools_features.lazygit | default(false)

- name: Clonar plugins do Tmux (TPM)
  become: false
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ user_home }}/.tmux/plugins/tpm"
    version: master
  when: devtools_features.tpm | default(false)
