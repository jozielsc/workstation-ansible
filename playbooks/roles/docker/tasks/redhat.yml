---
- name: Avisar quando a distribuição RedHat não tem repositório Docker mapeado
  ansible.builtin.debug:
    msg: >-
      ⚠️ Distribuição '{{ ansible_facts['distribution'] }}' sem repositório oficial do Docker mapeado
      (docker_rpm_repo_distro); Docker não instalado.
  when: ansible_facts['distribution'] not in docker_rpm_repo_distro

- name: Instalar Docker pelo repositório oficial (RedHat/Fedora)
  when: ansible_facts['distribution'] in docker_rpm_repo_distro
  vars:
    _docker_rpm_repo_url: "https://download.docker.com/linux/{{ docker_rpm_repo_distro[ansible_facts['distribution']] }}"
  block:
    - name: Importar chave GPG do Docker
      ansible.builtin.rpm_key:
        key: "{{ _docker_rpm_repo_url }}/gpg"
        state: present

    # yum_repository grava o .repo direto, sem depender do "dnf config-manager" (sintaxe diferente no dnf5).
    # Mesmo arquivo e seção do docker-ce.repo oficial, para não duplicar o repositório num host que seguiu o
    # guia do Docker. skip_if_unavailable: numa versão do Fedora que o Docker ainda não publicou ($releasever
    # dá 404), a instalação do Docker ainda falha e para o play nesta role, mas o repositório que fica gravado não
    # quebra o dnf das outras roles nas execuções seguintes (ex.: com outras TAGS).
    - name: Configurar repositório oficial do Docker
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        file: docker-ce
        description: Docker CE Stable - $basearch
        baseurl: "{{ _docker_rpm_repo_url }}/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: "{{ _docker_rpm_repo_url }}/gpg"
        enabled: true
        skip_if_unavailable: true
      register: docker_rpm_repo

    - name: Verificar se o Docker já está instalado
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: docker_dockerd

    # Em check mode, um repositório ainda não configurado (ou diferente) só foi simulado, e o dnf pode não ver o
    # docker-ce. Só pula a instalação quando o Docker ainda não está instalado (sem /usr/bin/dockerd); senão, o check segue normalmente.
    - name: Informar que o Docker seria instalado (check mode)
      ansible.builtin.debug:
        msg: Docker seria instalado do repositório oficial ({{ _docker_rpm_repo_url }}).
      changed_when: true
      when:
        - ansible_check_mode
        - docker_rpm_repo is changed
        - not docker_dockerd.stat.exists

    - name: Instalar Docker
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: not (ansible_check_mode and docker_rpm_repo is changed and not docker_dockerd.stat.exists)
