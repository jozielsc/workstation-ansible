# ==============================================================================
# Perfil Padrão - Workstation Ansible
#
# NOTA: Os pacotes base específicos para cada distribuição Linux (Debian, Void,
# RedHat, Arch) são carregados automaticamente de cada role (playbooks/roles/*/vars/).
# Utilize os campos *_extra_packages abaixo para adicionar pacotes adicionais.
# ==============================================================================

# --- Pacotes e Features de Ferramentas de Desenvolvimento ---
devtools_extra_packages: []

devtools_features:
  lazygit: true
  tpm: true  # Tmux Plugin Manager

# --- Linguagens de Programação ---
languages_features:
  python: true # UV + Pipx
  node: true   # System Node.js
  rust: true   # Rustup
  golang: true # Go compiler

# --- Interface Gráfica (Sway / Wayland) ---
ui_extra_packages: []

ui_features:
  fonts: true # Nerd Fonts (JetBrainsMono)

# --- Editores ---
editors_extra_packages: []

editors_features: {} # Configurações adicionais de editores
