[project]
name = "workstation-ansible"
version = "0.1.0"
description = "Provisionamento de uma workstation Linux de desenvolvimento com Ansible"
readme = "README.md"
authors = [
    { name = "Joziel Costa", email = "jozielsc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ansible>=14.5.0",
    "ansible-lint>=26.9.0",
    "molecule>=26.9.0",
]

[tool.uv]
# Projeto Ansible, não um pacote Python: o uv só gerencia o ambiente de
# desenvolvimento (ansible, ansible-lint, molecule).
package = false
