---
- name: Mapear arquitetura para o release do Lazygit
  ansible.builtin.set_fact:
    _devtools_lazygit_arch_map:
      x86_64: Linux_x86_64
      aarch64: Linux_arm64
      armv7l: Linux_armv6
      armv6l: Linux_armv6

- name: Definir arquitetura alvo do Lazygit
  ansible.builtin.set_fact:
    _devtools_lazygit_arch: "{{ _devtools_lazygit_arch_map[ansible_facts['architecture']] | default('') }}"

- name: Avisar quando a arquitetura não é suportada pelo Lazygit
  ansible.builtin.debug:
    msg: "⚠️ Arquitetura '{{ ansible_facts['architecture'] }}' não mapeada para o Lazygit; instalação ignorada."
  when: _devtools_lazygit_arch | length == 0

# Só baixa quando a versão instalada difere da última do GitHub. Uma falha (rede, rate limit da API,
# download) vira aviso no rescue e não aborta o play.
- name: Instalar Lazygit (binário oficial)
  when: _devtools_lazygit_arch | length > 0
  block:
    - name: Verificar versão instalada do Lazygit
      ansible.builtin.command: /usr/local/bin/lazygit --version
      register: devtools_lazygit_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Descobrir última versão do Lazygit
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
      register: devtools_lazygit_release
      check_mode: false

    - name: Comparar versão instalada com a última do Lazygit
      ansible.builtin.set_fact:
        # A saída tem "version=X" e, mais adiante, "git version=Y"; a âncora pega só a do Lazygit.
        _devtools_lazygit_current: >-
          {{ devtools_lazygit_installed.stdout | default('')
          | regex_findall('(?:^|, )version=([0-9][^,]*)') | first | default('') }}
        _devtools_lazygit_latest: "{{ devtools_lazygit_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Informar a versão do Lazygit que seria instalada (check mode)
      ansible.builtin.debug:
        msg: >-
          Lazygit seria
          {{ 'atualizado de ' ~ _devtools_lazygit_current ~ ' para' if _devtools_lazygit_current else 'instalado na versão' }}
          {{ _devtools_lazygit_latest }}.
      changed_when: true
      when:
        - ansible_check_mode
        - _devtools_lazygit_current != _devtools_lazygit_latest

    - name: Baixar e instalar Lazygit
      when:
        - not ansible_check_mode
        - _devtools_lazygit_current != _devtools_lazygit_latest
      block:
        - name: Criar diretório temporário para Lazygit
          ansible.builtin.tempfile:
            state: directory
            suffix: lazygit
          register: devtools_lazygit_temp

        - name: Baixar e extrair Lazygit
          ansible.builtin.unarchive:
            src: "https://github.com/jesseduffield/lazygit/releases/download/{{ _devtools_lazygit_tag }}/{{ _devtools_lazygit_tarball }}"
            dest: "{{ devtools_lazygit_temp.path }}"
            remote_src: true
          vars:
            _devtools_lazygit_tag: "{{ devtools_lazygit_release.json.tag_name }}"
            _devtools_lazygit_tarball: "lazygit_{{ _devtools_lazygit_latest }}_{{ _devtools_lazygit_arch }}.tar.gz"

        - name: Instalar binário do Lazygit
          ansible.builtin.copy:
            src: "{{ devtools_lazygit_temp.path }}/lazygit"
            dest: /usr/local/bin/lazygit
            mode: '0755'
            remote_src: true
          become: true

  rescue:
    - name: Avisar que o Lazygit não foi instalado
      ansible.builtin.debug:
        msg: >-
          ⚠️ Não foi possível instalar ou atualizar o Lazygit (tarefa '{{ ansible_failed_task.name }}'):
          {{ ansible_failed_result.msg | default('erro desconhecido') }}. O play continua sem essa atualização.

  always:
    - name: Remover diretório temporário
      ansible.builtin.file:
        path: "{{ devtools_lazygit_temp.path }}"
        state: absent
      when: devtools_lazygit_temp.path is defined
