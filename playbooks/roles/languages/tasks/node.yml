---
- name: "📌 STATUS: Configurando ambiente Node.js"
  ansible.builtin.debug:
    msg: "🟢 LANG: Instalando Node.js e NPM do sistema..."
  when: languages_features.node | default(true)

- name: Instalar Node.js e NPM (Sistema)
  ansible.builtin.package:
    name: "{{ languages_node_packages[ansible_facts['os_family']] | default(['nodejs']) }}"
    state: present
  tags: [node]
  when: languages_features.node | default(true)
