---
- name: Carregar variáveis específicas do SO
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"
  failed_when: false

- name: Definir pacotes padrão de UI se não configurados pelo SO
  ansible.builtin.set_fact:
    ui_packages:
      - sway
      - waybar
      - wofi
  when: ui_packages is not defined

- name: Consolidação dos pacotes a instalar (UI)
  ansible.builtin.set_fact:
    _ui_target_packages: "{{ (ui_packages | default([])) + (ui_extra_packages | default([])) }}"

- name: "📌 STATUS: Iniciando instalação da Interface Gráfica (UI)"
  ansible.builtin.debug:
    msg:
      - "================================================================================="
      - " 🖼️ ROLE: UI | SISTEMA: {{ ansible_facts['os_family'] }}"
      - " 📦 TOTAL DE PACOTES: {{ _ui_target_packages | length }} pacotes"
      - " 📋 PACOTES: {{ _ui_target_packages | join(', ') }}"
      - " ⏳ Processando instalação no gerenciador de pacotes... Por favor aguarde."
      - "================================================================================="

- name: Instalação resiliente de pacotes de UI
  block:
    - name: Tentar instalação em lote de pacotes de UI
      ansible.builtin.package:
        name: "{{ _ui_target_packages }}"
        state: present
  rescue:
    - name: Aviso de falha na instalação em lote - tentando pacotes de UI individualmente
      ansible.builtin.debug:
        msg: "⚠️ Falha na instalação em lote de UI. Alternando para instalação individual por pacote..."

    - name: Instalar pacotes de UI individualmente
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ _ui_target_packages }}"
      register: _ui_indiv_results
      failed_when: false

    - name: Reportar pacotes de UI indisponíveis no repositório
      ansible.builtin.debug:
        msg: "⚠️ Aviso: O pacote de UI '{{ item.item }}' não foi encontrado ou falhou ao ser instalado."
      loop: "{{ _ui_indiv_results.results | default([]) }}"
      when: item.failed is defined and item.failed
      loop_control:
        label: "{{ item.item }}"

- name: Garantir diretório de fontes locais
  become: false
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/fonts"
    state: directory
    mode: '0755'
  when: ui_features.fonts | default(false)

- name: Verificar se a fonte Nerd Font já está instalada
  become: false
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"
  register: nerdfont_check
  when: ui_features.fonts | default(false)

- name: Baixar JetBrainsMono Nerd Font
  become: false
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/JetBrainsMono.zip
    dest: "{{ user_home }}/.local/share/fonts"
    remote_src: yes
  when: 
    - ui_features.fonts | default(false)
    - nerdfont_check.stat is defined
    - not nerdfont_check.stat.exists

- name: Atualizar cache de fontes
  become: false
  ansible.builtin.command: fc-cache -f -v
  when: 
    - ui_features.fonts | default(false)
    - nerdfont_check.stat is defined
    - not nerdfont_check.stat.exists
