---
- name: Instalar Docker em Debian/Ubuntu
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Instalar Docker em RedHat/Fedora
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Instalar Docker em Arch Linux
  ansible.builtin.include_tasks: archlinux.yml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Instalar Docker em Void Linux
  ansible.builtin.include_tasks: void.yml
  when: ansible_facts['distribution'] == "Void"

# Um único passo de serviço para as distros com systemd. O docker.service vem do pacote: numa distro sem
# instalação, ou em check mode antes dela, ele não existe e o módulo falharia, então só habilita se existir.
- name: Coletar os serviços do systemd
  ansible.builtin.service_facts:
  when: ansible_facts['service_mgr'] == "systemd"

- name: Habilitar serviço Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when:
    - ansible_facts['service_mgr'] == "systemd"
    - "'docker.service' in ansible_facts['services']"

# O grupo docker vem do pacote. Numa distro sem tarefa de instalação, ou em check mode antes da instalação,
# ele não existe e o módulo user falharia; nesse caso só avisa.
- name: Verificar se o grupo docker existe
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false

- name: Adiciona usuário ao grupo docker
  ansible.builtin.user:
    name: "{{ user_id }}"
    groups: docker
    append: true
  when: ansible_facts['getent_group']['docker'] is not none

- name: Avisar quando o grupo docker não existe
  ansible.builtin.debug:
    msg: >-
      ⚠️ Grupo 'docker' não existe{{ ' (check mode: a instalação acima só foi simulada)' if ansible_check_mode else '' }};
      '{{ user_id }}' não foi adicionado a ele.
  when: ansible_facts['getent_group']['docker'] is none
